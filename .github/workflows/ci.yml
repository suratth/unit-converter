# devbase 自己完結 CI テンプレート(public リポ用)
#
# public リポは private の devbase reusable workflow を参照できない(GitHub の制約)ため、
# 軽量ゲートを自己完結で持つ縮小版。private リポは templates/ci.yml(共通 workflow 参照)を使うこと。
# 内容は quality-gate.yml の縮小写し(構文/ESLint/shellcheck/gitleaks)。正本は quality-gate.yml。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 依存導入(package.json がある場合のみ)
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; else echo "package.json なし"; fi
      - name: 構文(bash -n / node --check)
        run: |
          find . -path ./node_modules -prune -o -path ./.git -prune -o -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          find . -path ./node_modules -prune -o -path ./.git -prune -o \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check
      - name: ESLint(eslint.config.mjs がある場合のみ)
        run: |
          if [ -f eslint.config.mjs ]; then npx eslint .; else echo "eslint.config.mjs が無いので飛ばす"; fi
      - name: shellcheck(error 級のみ)
        run: |
          command -v shellcheck >/dev/null || { echo "shellcheck なし=飛ばす"; exit 0; }
          find . -path ./node_modules -prune -o -path ./.git -prune -o -name '*.sh' -print0 | xargs -0 -r shellcheck -S error
      - name: gitleaks(G9。fail-closed)
        # `-q` は存在しないフラグ・`&& echo` は errexit 対象外で、旧版は検知ゼロのまま緑だった
        # (ADR-132 の実測4)。正本 quality-gate.yml と同じ直し方で揃える。
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --log-level error --exit-code 1 .
          echo "G9 秘密漏洩なし"
