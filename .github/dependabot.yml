# devbase 共通 dependabot テンプレート
#
# 使い方: このファイルを consumer リポの .github/dependabot.yml にコピーする。
# npm と github-actions の依存を weekly で更新チェックする。

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7  # G10: 出たての版を 7 日寝かせる(supply-chain の鮮度攻撃対策)

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7  # G10: 出たての版を 7 日寝かせる(supply-chain の鮮度攻撃対策)
